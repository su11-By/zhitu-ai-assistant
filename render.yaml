services:
  - type: web
    name: zhitu-ai-assistant
    runtime: python
    buildCommand: cd server && pip install -r requirements.txt
    startCommand: cd server && gunicorn app:app --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.10.0
